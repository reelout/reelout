name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      type:
        description: 'Choose a release type instead of deriving it from commits; use auto to analyze commits.'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
      qualifier:
        description: 'Set the SemVer prerelease identifier; use false to disable it or true to follow branch rules.'
        type: string
      channel:
        description: 'Set the npm dist-tag; use false to disable it or true to follow branch rules.'
        type: string
      allow-empty:
        description: 'Run the release workflow even when no releasable changes are detected.'
        type: boolean
        default: false
      dry-run:
        description: 'Preview the release without writing files, creating commits or tags, or publishing packages or releases.'
        type: boolean
        default: false
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm validate
      - run: |
          ARGS=()
          [ -n "${{ inputs.type }}" ] && ARGS+=("--type" "${{ inputs.type }}")
          [ -n "${{ inputs.qualifier }}" ] && ARGS+=("--qualifier" "${{ inputs.qualifier }}")
          [ -n "${{ inputs.channel }}" ] && ARGS+=("--channel" "${{ inputs.channel }}")
          [ "${{ inputs.allow-empty }}" = "true" ] && ARGS+=("--allow-empty")
          [ "${{ inputs.dry-run }}" = "true" ] && ARGS+=("--dry-run")
          node dist/cli.js "${ARGS[@]}"
