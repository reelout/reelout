  '@types/npmcli__config': ^6.0.4
  '@types/semver': ^7.8.0
  '@vitest/coverage-istanbul': ^5.1.0
  '@yarnpkg/core': 4.9.1
  '@yarnpkg/fslib': ^3.1.5
  '@yarnpkg/plugin-npm': ^3.7.1
  commander: ^15.1.0
